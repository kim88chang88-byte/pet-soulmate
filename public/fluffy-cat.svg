<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="cardBg" cx="50%" cy="45%" r="72%">
      <stop offset="0%" stop-color="#f8f4ff"/>
      <stop offset="55%" stop-color="#ede4ff"/>
      <stop offset="100%" stop-color="#d8c8f8"/>
    </radialGradient>
    <radialGradient id="catHead" cx="42%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#f8f4f0"/>
      <stop offset="58%" stop-color="#e8dcd0"/>
      <stop offset="100%" stop-color="#d4c4b0"/>
    </radialGradient>
    <radialGradient id="catBody" cx="50%" cy="25%" r="65%">
      <stop offset="0%" stop-color="#f0e8e0"/>
      <stop offset="65%" stop-color="#d8c8b8"/>
      <stop offset="100%" stop-color="#c0a888"/>
    </radialGradient>
    <radialGradient id="eyeL" cx="38%" cy="32%" r="58%">
      <stop offset="0%" stop-color="#98d098"/>
      <stop offset="45%" stop-color="#68a868"/>
      <stop offset="100%" stop-color="#407840"/>
    </radialGradient>
    <radialGradient id="eyeR" cx="62%" cy="32%" r="58%">
      <stop offset="0%" stop-color="#98d098"/>
      <stop offset="45%" stop-color="#68a868"/>
      <stop offset="100%" stop-color="#407840"/>
    </radialGradient>
    <linearGradient id="earInner" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffb0c4"/>
      <stop offset="100%" stop-color="#ffd0de"/>
