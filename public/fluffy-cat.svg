  <!-- Outer frame -->
  <rect width="1024" height="1024" rx="28" fill="#b0a0c8"/>

  <!-- Inner card -->
  <rect x="40" y="40" width="944" height="944" rx="22" fill="url(#cardBg)"/>

  <!-- Bokeh circles -->
