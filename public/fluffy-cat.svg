  <circle cx="780" cy="240" r="70" fill="#c8b8f8" filter="url(#bokeh)" opacity="0.4"/>
  <circle cx="800" cy="720" r="110" fill="#e8d4ff" filter="url(#bokeh)" opacity="0.38"/>
