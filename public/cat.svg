      <stop offset="0%" stop-color="#f4eeff"/>
      <stop offset="55%" stop-color="#ecdcff"/>
      <stop offset="100%" stop-color="#d5eeea"/>
    </radialGradient>
    <radialGradient id="catHead" cx="42%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#fffcfa"/>
      <stop offset="65%" stop-color="#f8ede4"/>
      <stop offset="100%" stop-color="#edd8cc"/>
