<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="cardBg" cx="50%" cy="45%" r="72%">
      <stop offset="0%" stop-color="#f0f8ff"/>
      <stop offset="55%" stop-color="#dceeff"/>
      <stop offset="100%" stop-color="#c8e0f8"/>
    </radialGradient>
    <radialGradient id="dogHead" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f8f0e0"/>
      <stop offset="60%" stop-color="#e8d8b8"/>
      <stop offset="100%" stop-color="#d4b888"/>
    </radialGradient>
    <radialGradient id="dogBody" cx="50%" cy="25%" r="65%">
      <stop offset="0%" stop-color="#f0e8d0"/>
      <stop offset="65%" stop-color="#d8c090"/>
      <stop offset="100%" stop-color="#c0a068"/>
    </radialGradient>
    <radialGradient id="eyeL" cx="38%" cy="32%" r="58%">
      <stop offset="0%" stop-color="#7090b0"/>
      <stop offset="50%" stop-color="#507090"/>
      <stop offset="100%" stop-color="#305070"/>
    </radialGradient>
    <radialGradient id="eyeR" cx="62%" cy="32%" r="58%">
      <stop offset="0%" stop-color="#7090b0"/>
      <stop offset="50%" stop-color="#507090"/>
      <stop offset="100%" stop-color="#305070"/>
    </radialGradient>
    <linearGradient id="bandana" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4090e0"/>
      <stop offset="100%" stop-color="#2060b0"/>
