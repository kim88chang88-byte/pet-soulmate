  <text x="770" y="424" font-size="38" fill="#ffc870" opacity="0.85" filter="url(#glow)">♥</text>
  <text x="820" y="545" font-size="28" fill="#ffe4b4" opacity="0.74">♥</text>
  <text x="244" y="718" font-size="25" fill="#a0d4a0" opacity="0.68">♥</text>
  <text x="762" y="718" font-size="32" fill="#60a0e0" opacity="0.74">♥</text>

