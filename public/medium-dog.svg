    <linearGradient id="rbTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffb3c1"/><stop offset="17%" stop-color="#ffd6b3"/>
      <stop offset="34%" stop-color="#fffab3"/><stop offset="50%" stop-color="#b3f4d2"/>
      <stop offset="67%" stop-color="#b3d6f4"/><stop offset="84%" stop-color="#c8b3f4"/>
      <stop offset="100%" stop-color="#ffb3c1"/>
    </linearGradient>
    <linearGradient id="rbBottom" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ffb3c1"/><stop offset="17%" stop-color="#ffd6b3"/>
      <stop offset="34%" stop-color="#fffab3"/><stop offset="50%" stop-color="#b3f4d2"/>
      <stop offset="67%" stop-color="#b3d6f4"/><stop offset="84%" stop-color="#c8b3f4"/>
      <stop offset="100%" stop-color="#ffb3c1"/>
    </linearGradient>
    <linearGradient id="rbLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c8b3f4"/><stop offset="20%" stop-color="#ffb3c1"/>
      <stop offset="40%" stop-color="#ffd6b3"/><stop offset="60%" stop-color="#fffab3"/>
      <stop offset="80%" stop-color="#b3f4d2"/><stop offset="100%" stop-color="#b3d6f4"/>
    </linearGradient>
    <linearGradient id="rbRight" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#c8b3f4"/><stop offset="20%" stop-color="#ffb3c1"/>
      <stop offset="40%" stop-color="#ffd6b3"/><stop offset="60%" stop-color="#fffab3"/>
      <stop offset="80%" stop-color="#b3f4d2"/><stop offset="100%" stop-color="#b3d6f4"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bokeh"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="124%">
      <feDropShadow dx="0" dy="5" stdDeviation="14" flood-color="rgba(80,60,30,0.15)"/>
    </filter>
    <filter id="tglow" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="cc"><rect x="40" y="40" width="944" height="944" rx="22"/></clipPath>
