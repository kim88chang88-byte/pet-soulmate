  <text x="770" y="425" font-size="38" fill="#fffab0" opacity="0.85" filter="url(#glow)">♥</text>
  <text x="820" y="544" font-size="28" fill="#ffe4b4" opacity="0.74">♥</text>
  <text x="244" y="718" font-size="25" fill="#a8d4e0" opacity="0.68">♥</text>
