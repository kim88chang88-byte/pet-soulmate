    <ellipse cx="-15" cy="-9" rx="6" ry="5" fill="rgba(70,90,140,0.5)"/>
    <ellipse cx="-5" cy="-16" rx="6" ry="5" fill="rgba(70,90,140,0.5)"/>
    <ellipse cx="6"  cy="-16" rx="6" ry="5" fill="rgba(70,90,140,0.5)"/>
    <ellipse cx="15" cy="-9"  rx="6" ry="5" fill="rgba(70,90,140,0.5)"/>
