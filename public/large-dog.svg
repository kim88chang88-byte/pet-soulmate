  <rect x="40" y="902" width="944" height="82" fill="url(#rbBottom)" opacity="0.82" clip-path="url(#cc)"/>
  <rect x="40" y="40"  width="82"  height="944" fill="url(#rbLeft)"  opacity="0.82" clip-path="url(#cc)"/>
  <rect x="922" y="40" width="82"  height="944" fill="url(#rbRight)" opacity="0.82" clip-path="url(#cc)"/>
  <rect x="40" y="40" width="944" height="944" rx="22" fill="none" stroke="rgba(255,255,255,0.65)" stroke-width="4"/>
  <rect x="48" y="48" width="928" height="928" rx="18" fill="none" stroke="rgba(255,255,255,0.28)" stroke-width="2"/>

