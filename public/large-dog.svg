<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="cardBg" cx="50%" cy="45%" r="72%">
      <stop offset="0%" stop-color="#f0f5ff"/>
      <stop offset="55%" stop-color="#dce8ff"/>
      <stop offset="100%" stop-color="#c8d8f8"/>
    </radialGradient>
    <radialGradient id="dogHead" cx="45%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#f8f8ff"/>
      <stop offset="55%" stop-color="#e8e8f0"/>
      <stop offset="100%" stop-color="#c8cce0"/>
    </radialGradient>
    <radialGradient id="dogBody" cx="50%" cy="25%" r="65%">
      <stop offset="0%" stop-color="#f0f0f8"/>
      <stop offset="65%" stop-color="#d8d8e8"/>
      <stop offset="100%" stop-color="#b8bcd4"/>
    </radialGradient>
    <radialGradient id="eyeL" cx="38%" cy="32%" r="58%">
      <stop offset="0%" stop-color="#80b0e0"/>
      <stop offset="45%" stop-color="#5080b8"/>
      <stop offset="100%" stop-color="#305890"/>
    </radialGradient>
    <radialGradient id="eyeR" cx="62%" cy="32%" r="58%">
      <stop offset="0%" stop-color="#80b0e0"/>
      <stop offset="45%" stop-color="#5080b8"/>
      <stop offset="100%" stop-color="#305890"/>
    </radialGradient>
    <linearGradient id="maskPatch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#606878"/>
      <stop offset="100%" stop-color="#484e60"/>
    </linearGradient>
    <linearGradient id="rbTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffb3c1"/><stop offset="17%" stop-color="#ffd6b3"/>
      <stop offset="34%" stop-color="#fffab3"/><stop offset="50%" stop-color="#b3f4d2"/>
      <stop offset="67%" stop-color="#b3d6f4"/><stop offset="84%" stop-color="#c8b3f4"/>
      <stop offset="100%" stop-color="#ffb3c1"/>
    </linearGradient>
    <linearGradient id="rbBottom" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ffb3c1"/><stop offset="17%" stop-color="#ffd6b3"/>
      <stop offset="34%" stop-color="#fffab3"/><stop offset="50%" stop-color="#b3f4d2"/>
      <stop offset="67%" stop-color="#b3d6f4"/><stop offset="84%" stop-color="#c8b3f4"/>
      <stop offset="100%" stop-color="#ffb3c1"/>
    </linearGradient>
    <linearGradient id="rbLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c8b3f4"/><stop offset="20%" stop-color="#ffb3c1"/>
      <stop offset="40%" stop-color="#ffd6b3"/><stop offset="60%" stop-color="#fffab3"/>
      <stop offset="80%" stop-color="#b3f4d2"/><stop offset="100%" stop-color="#b3d6f4"/>
    </linearGradient>
    <linearGradient id="rbRight" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#c8b3f4"/><stop offset="20%" stop-color="#ffb3c1"/>
      <stop offset="40%" stop-color="#ffd6b3"/><stop offset="60%" stop-color="#fffab3"/>
      <stop offset="80%" stop-color="#b3f4d2"/><stop offset="100%" stop-color="#b3d6f4"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bokeh"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="124%">
      <feDropShadow dx="0" dy="5" stdDeviation="14" flood-color="rgba(60,70,100,0.15)"/>
    </filter>
    <filter id="tglow" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="cc"><rect x="40" y="40" width="944" height="944" rx="22"/></clipPath>
  </defs>

  <!-- Outer frame -->
  <rect width="1024" height="1024" rx="28" fill="#6880a8"/>

