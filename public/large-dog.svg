    <line x1="0" y1="-22" x2="0" y2="22" stroke="#ffe8a0" stroke-width="4" stroke-linecap="round"/>
    <line x1="-22" y1="0" x2="22" y2="0" stroke="#ffe8a0" stroke-width="4" stroke-linecap="round"/>
    <line x1="-14" y1="-14" x2="14" y2="14" stroke="#ffe8a0" stroke-width="2" stroke-linecap="round"/>
    <line x1="14" y1="-14" x2="-14" y2="14" stroke="#ffe8a0" stroke-width="2" stroke-linecap="round"/>
