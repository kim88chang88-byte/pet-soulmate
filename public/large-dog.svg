  <circle cx="780" cy="240" r="70" fill="#98b8e8" filter="url(#bokeh)" opacity="0.4"/>
  <circle cx="800" cy="720" r="110" fill="#b8d0ff" filter="url(#bokeh)" opacity="0.38"/>
  <circle cx="180" cy="780" r="80" fill="#a8c8f0" filter="url(#bokeh)" opacity="0.35"/>
  <circle cx="512" cy="570" r="155" fill="#c8dcff" filter="url(#bokeh)" opacity="0.3"/>

  <!-- Holographic border -->
