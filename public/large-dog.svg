  <text x="300" y="978" text-anchor="middle" font-size="17" fill="rgba(160,200,255,0.82)">✦</text>
  <text x="724" y="978" text-anchor="middle" font-size="17" fill="rgba(160,200,255,0.82)">✦</text>
