  <path d="M490,592 Q512,616 534,592" fill="none" stroke="rgba(40,40,50,0.55)" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M485,604 Q490,592 512,598" fill="none" stroke="rgba(40,40,50,0.45)" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M539,604 Q534,592 512,598" fill="none" stroke="rgba(40,40,50,0.45)" stroke-width="2.8" stroke-linecap="round"/>

